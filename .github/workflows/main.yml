name: Web E2E Tests
on:
  workflow_dispatch:
jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      # clone do projeto para a máquina
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Conferir a versão instalada
      - name: Node version
        run: node --version
      - name: Instalando dependências
        run: npm ci
      - name: Executando os testes
        run: npx cypress run --spec "cypress/e2e/automation-exercise/automation-exercise-exercicio.cy.js,cypress/e2e/automation-exercise/automation-exercice-modules.cy.js"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
